name: Build and test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: Linux (Ubuntu)
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential autoconf automake libtool pkg-config gettext \
            libgtk-3-dev libjack-jackd2-dev portaudio19-dev libfftw3-dev \
            xvfb xauth

      - name: Build
        run: |
          ./autogen.sh
          ./configure
          make -j2
      - name: Test
        run: |
          xvfb-run -a make test

  windows:
    name: Windows (MSYS2 MINGW64)
    runs-on: windows-latest

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - uses: actions/checkout@v4

      - name: Set up MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git
            make
            autoconf
            automake
            libtool
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-gtk3
            mingw-w64-x86_64-portaudio
            mingw-w64-x86_64-fftw
            mingw-w64-x86_64-gettext-tools

      - name: Build and test
        run: |
          ./autogen.sh
          ./configure
          make -j2
          make test

  macos:
    name: macOS (Apple Silicon)
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew install gtk+3 portaudio fftw pkg-config \
            autoconf automake libtool gettext
          echo "$(brew --prefix gettext)/bin" >> "$GITHUB_PATH"

      - name: Build and test
        run: |
          ./autogen.sh
          ./configure
          make -j2
          make test

      - name: Inspect macOS binary
        run: |
          file ./tg-expert
          otool -L ./tg-expert
